<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>App</title>
  
  <!-- PWA Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="App">
  
  <!-- Tailwind CSS & Lucide Icons & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Google API / Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212; /* グラファイト・ダーク基調 */
      color: #e2e8f0;
      -webkit-tap-highlight-color: transparent;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      table-layout: fixed;
    }
    /* 各日の高さを広げて予定が埋まらないように改善 */
    .calendar-cell {
      min-height: 120px;
    }
    @media (max-width: 640px) {
      .calendar-cell {
        min-height: 95px;
      }
    }
    .truncate-1 {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    /* シャンパンゴールドのアクセント用カスタム */
    .champagne-gold { color: #d4af37; }
    .bg-champagne-gold { background-color: #d4af37; }
    .border-champagne-gold { border-color: #d4af37; }

    /* GoogleカレンダーのカラーIDに対応する背景色 */
    .gcal-color-1 { background-color: #7986cb !important; color: #fff !important; }
    .gcal-color-2 { background-color: #33b679 !important; color: #fff !important; }
    .gcal-color-3 { background-color: #8e24aa !important; color: #fff !important; }
    .gcal-color-4 { background-color: #e67c73 !important; color: #fff !important; }
    .gcal-color-5 { background-color: #f6bf26 !important; color: #121212 !important; }
    .gcal-color-6 { background-color: #f4511e !important; color: #fff !important; }
    .gcal-color-7 { background-color: #039be5 !important; color: #fff !important; }
    .gcal-color-8 { background-color: #616161 !important; color: #fff !important; }
    .gcal-color-9 { background-color: #3f51b5 !important; color: #fff !important; }
    .gcal-color-10 { background-color: #0b8043 !important; color: #fff !important; }
    .gcal-color-11 { background-color: #d50000 !important; color: #fff !important; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col pb-12">

  <script>
    const CLIENT_ID = '1068662457579-mjlsd7blb627089v06hd4i2td53uu8gn.apps.googleusercontent.com';
    const SPREADSHEET_ID = '1tpi8xp5YMz-Cw3Jtk9xSAgQUg6_Hi9gj1n2dI5_VKqg';
    const SCOPES = 'https://www.googleapis.com/auth/calendar https://www.googleapis.com/auth/tasks https://www.googleapis.com/auth/spreadsheets';
  </script>

  <!-- ローディングオーバーレイ -->
  <div id="loading-overlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white hidden">
    <div class="w-10 h-10 border-4 border-[#d4af37] border-t-transparent rounded-full animate-spin mb-3"></div>
    <p id="loading-text" class="text-sm font-semibold text-slate-300">処理中...</p>
  </div>

  <!-- ヘッダー（ログインボタンのみ右上に配置） -->
  <header class="bg-[#1a1a1a]/80 backdrop-blur-md sticky top-0 z-30 border-b border-slate-800 px-4 py-3 shadow-sm">
    <div class="max-w-5xl mx-auto flex items-center justify-end">
      <button id="auth-btn" onclick="handleAuthClick()" class="flex items-center space-x-1.5 bg-[#262626] text-[#d4af37] border border-[#d4af37]/30 hover:bg-[#333333] px-4 py-2 rounded-full text-xs font-semibold transition shadow-sm">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span id="auth-btn-text">Google 連携</span>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto w-full px-3 sm:px-6 pt-5 flex-1">

    <!-- モード切り替えタブ -->
    <nav class="flex space-x-1 bg-[#1a1a1a] border border-slate-800 p-1 rounded-2xl mb-5 overflow-x-auto text-xs sm:text-sm font-medium no-scrollbar">
      <button onclick="switchMode('all')" id="tab-all" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl transition text-center shadow-sm bg-[#262626] text-[#d4af37] font-bold">すべて</button>
      <button onclick="switchMode('calendar')" id="tab-calendar" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl transition text-center text-slate-400 hover:text-slate-200">予定</button>
      <button onclick="switchMode('task')" id="tab-task" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl transition text-center text-slate-400 hover:text-slate-200">タスク</button>
      <button onclick="switchMode('finance')" id="tab-finance" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl transition text-center text-slate-400 hover:text-slate-200">家計簿</button>
      <button onclick="switchMode('analytics')" id="tab-analytics" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl transition text-center text-slate-400 hover:text-slate-200">分析</button>
      <button onclick="switchMode('habit')" id="tab-habit" class="mode-tab flex-1 min-w-[70px] py-2 px-3 rounded-xl transition text-center text-slate-400 hover:text-slate-200">習慣</button>
    </nav>

    <!-- モード 1: すべてモード -->
    <section id="section-all-summary" class="mode-section mb-5">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-[#1a1a1a] p-4 rounded-2xl border border-slate-800 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold text-slate-200 flex items-center gap-1.5">
              <i data-lucide="calendar" class="w-4 h-4 text-[#d4af37]"></i> 今日の予定
            </h2>
            <span id="today-date-str" class="text-xs text-slate-500"></span>
          </div>
          <div id="today-events-list" class="space-y-2 text-xs text-slate-400">

          </div>
        </div>

        <div class="bg-[#1a1a1a] p-4 rounded-2xl border border-slate-800 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold text-slate-200 flex items-center gap-1.5">
              <i data-lucide="check-square" class="w-4 h-4 text-emerald-400"></i> 本日のタスク

            <p class="text-slate-500 italic">連携後、タスクが表示されます</p>

    <!-- フォームエリア -->
    <section id="input-section" class="mb-5 hidden">
      <!-- 予定追加フォーム（メモ・カラー選択対応） -->
      <div id="form-calendar" class="input-form bg-[#1a1a1a] p-4 rounded-2xl border border-slate-800 shadow-sm hidden">
        <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-1.5"><i data-lucide="plus-circle" class="w-4 h-4 text-[#d4af37]"></i> 予定の追加（Googleカレンダー）</h3>
        <form onsubmit="addCalendarEvent(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <input type="text" id="event-title" placeholder="予定のタイトル" required class="sm:col-span-2 p-2.5 bg-[#262626] border border-slate-700 text-slate-200 rounded-xl outline-none focus:border-[#d4af37]">
          <input type="datetime-local" id="event-start" required class="p-2.5 bg-[#262626] border border-slate-700 text-slate-200 rounded-xl outline-none focus:border-[#d4af37]">
          <input type="datetime-local" id="event-end" required class="p-2.5 bg-[#262626] border border-slate-700 text-slate-200 rounded-xl outline-none focus:border-[#d4af37]">
          <textarea id="event-memo" placeholder="メモ・詳細 (Googleカレンダーに反映されます)" rows="2" class="sm:col-span-2 p-2.5 bg-[#262626] border border-slate-700 text-slate-200 rounded-xl outline-none focus:border-[#d4af37] resize-none"></textarea>
          <div class="sm:col-span-2 flex items-center gap-2">
            <label class="text-slate-400">カラー:</label>
            <select id="event-color" class="p-2 bg-[#262626] border border-slate-700 text-slate-200 rounded-xl outline-none">
              <option value="1">ラベンダー (デフォルト)</option>
              <option value="2">セージ</option>
              <option value="3">グレープ</option>
              <option value="4">フラミンゴ</option>
              <option value="5">バナナ</option>
              <option value="6">タンジェリン</option>
              <option value="7">ピーコック</option>
              <option value="8">グラファイト</option>
              <option value="9">ブルーベリー</option>
              <option value="10">バジル</option>
              <option value="11">トマト</option>
            </select>
          </div>

        </form>

      <!-- タスク追加フォーム -->

        <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-1.5"><i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i> タスクの追加（Google Tasks）</h3>
        <form onsubmit="addTaskItem(event)" class="flex gap-2 text-xs">
          <input type="text" id="task-title" placeholder="新しいタスク..." required class="flex-1 p-2.5 bg-[#262626] border border-slate-700 text-slate-200 rounded-xl outline-none focus:border-emerald-400">
          <input type="date" id="task-due" class="p-2.5 bg-[#262626] border border-slate-700 text-slate-200 rounded-xl outline-none focus:border-emerald-400">
          <button type="submit" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl transition whitespace-nowrap">追加</button>
        </form>

      <!-- 家計簿フォーム -->

        <form onsubmit="addExpenseRecord(event)" class="grid grid-cols-2 sm:grid-cols-5 gap-2.5 text-xs">

            <option value="その他">その他</option>

          <input type="text" id="expense-memo" placeholder="メモ" class="p-2.5 bg-[#262626] border border-slate-700 text-slate-200 rounded-xl outline-none focus:border-rose-400">
          <button type="submit" class="col-span-2 sm:col-span-1 p-2.5 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-xl transition">保存</button>
        </form>
      </div>
    </section>

    <!-- カレンダーセクション -->
    <section id="section-calendar" class="mode-section bg-[#1a1a1a] rounded-2xl border border-slate-800 shadow-sm p-3 sm:p-5 mb-5">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
          <button onclick="changeMonth(-1)" class="p-2 hover:bg-[#262626] rounded-xl transition"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-300"></i></button>
          <h2 id="calendar-month-year" class="text-base sm:text-lg font-bold text-slate-100"></h2>
          <button onclick="changeMonth(1)" class="p-2 hover:bg-[#262626] rounded-xl transition"><i data-lucide="chevron-right" class="w-5 h-5 text-slate-300"></i></button>
        </div>
        <button onclick="goToday()" class="text-xs px-3 py-1.5 bg-[#262626] hover:bg-[#333333] text-slate-300 font-semibold rounded-xl transition border border-slate-700">今日</button>

      <div class="calendar-grid text-center font-bold text-xs text-slate-500 border-b border-slate-800 pb-2 mb-1">
        <div class="text-rose-400">日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div class="text-[#d4af37]">土</div>

      <div id="monthly-expense-summary" class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center hidden">

    <!-- 分析モード -->
    <section id="section-analytics" class="mode-section hidden space-y-4 mb-5">
      <div class="bg-[#1a1a1a] p-5 rounded-2xl border border-slate-800 shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-bold text-slate-200 flex items-center gap-1.5"><i data-lucide="pie-chart" class="w-4 h-4 text-[#d4af37]"></i> カテゴリ別支出割合</h3>

    <!-- 習慣トラッカー -->

      <div class="bg-[#1a1a1a] p-5 rounded-2xl border border-slate-800 shadow-sm">
        <h3 class="text-sm font-bold text-slate-200 mb-3 flex items-center gap-1.5"><i data-lucide="check-circle-2" class="w-4 h-4 text-[#d4af37]"></i> 習慣・目標トラッカー</h3>
        
        <form onsubmit="addHabit(event)" class="flex gap-2 text-xs mb-4">
          <input type="text" id="habit-name" placeholder="新しい習慣 (例: 読書30分, 筋トレ)..." required class="flex-1 p-2.5 bg-[#262626] border border-slate-700 text-slate-200 rounded-xl outline-none focus:border-[#d4af37]">
          <button type="submit" class="px-4 py-2.5 bg-[#d4af37] hover:bg-[#c29f31] text-slate-950 font-bold rounded-xl transition">追加</button>

  <!-- 日別詳細モーダル（複数予定の指定フォーマット表示・編集対応） -->
  <div id="detail-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-[#1a1a1a] border border-slate-800 w-full max-w-md rounded-2xl shadow-xl overflow-hidden animate-in fade-in zoom-in duration-150 text-slate-200">
      <div class="p-4 bg-[#222222] border-b border-slate-800 flex justify-between items-center">
        <h3 id="modal-date-title" class="font-bold text-slate-100 text-sm"></h3>
        <button onclick="closeModal()" class="p-1 hover:bg-[#333333] rounded-lg text-slate-400 hover:text-slate-200"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-4 space-y-4 max-h-[70vh] overflow-y-auto text-xs">
        <div>
          <h4 class="font-bold text-[#d4af37] mb-2 flex items-center gap-1"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> 予定</h4>
          <div id="modal-events-list" class="space-y-2 text-slate-300 pl-2">なし</div>
        </div>
        <div>
          <h4 class="font-bold text-emerald-400 mb-2 flex items-center gap-1"><i data-lucide="check-square" class="w-3.5 h-3.5"></i> タスク (完了・削除操作可)</h4>
          <div id="modal-tasks-list" class="space-y-2 text-slate-300 pl-2">なし</div>
        </div>
        <div>
          <h4 class="font-bold text-rose-400 mb-2 flex items-center gap-1"><i data-lucide="credit-card" class="w-3.5 h-3.5"></i> 支出明細</h4>
          <div id="modal-expenses-list" class="space-y-1 text-slate-300 pl-2">なし</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 予定編集モーダル -->
  <div id="edit-event-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-[#1a1a1a] border border-slate-800 w-full max-w-md rounded-2xl shadow-xl overflow-hidden text-slate-200 p-5 space-y-3">
      <h3 class="font-bold text-sm text-[#d4af37]">予定の編集</h3>
      <input type="hidden" id="edit-ev-id">
      <input type="text" id="edit-ev-title" placeholder="タイトル" class="w-full p-2.5 bg-[#262626] border border-slate-700 rounded-xl text-xs">
      <input type="datetime-local" id="edit-ev-start" class="w-full p-2.5 bg-[#262626] border border-slate-700 rounded-xl text-xs">
      <input type="datetime-local" id="edit-ev-end" class="w-full p-2.5 bg-[#262626] border border-slate-700 rounded-xl text-xs">
      <textarea id="edit-ev-memo" placeholder="メモ" rows="2" class="w-full p-2.5 bg-[#262626] border border-slate-700 rounded-xl text-xs resize-none"></textarea>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeEditModal()" class="px-3 py-1.5 bg-slate-700 rounded-lg text-xs">キャンセル</button>
        <button onclick="updateCalendarEvent()" class="px-3 py-1.5 bg-[#d4af37] text-slate-950 font-bold rounded-lg text-xs">更新</button>
      </div>
    </div>
  </div>

  <!-- JavaScript Implementation -->
  <script>
    let currentMode = 'all';
    let currentDate = new Date();
    let tokenClient = null;
    let accessToken = sessionStorage.getItem('google_access_token') || null;

    let eventsData = [];
    let tasksData = [];
    let expensesData = [];
    let habitsData = JSON.parse(localStorage.getItem('habits') || '[]');
    let userBudget = localStorage.getItem('budget') || '';

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      document.getElementById('budget-input').value = userBudget;
      document.getElementById('today-date-str').textContent = `${currentDate.getFullYear()}/${currentDate.getMonth()+1}/${currentDate.getDate()}`;
      
      const todayIso = new Date().toISOString().split('T')[0];
      const expDateEl = document.getElementById('expense-date');
      if(expDateEl) expDateEl.value = todayIso;

      renderCalendar();
      renderHabits();

      if (accessToken) {
        setAuthorizedUI();
        fetchAllData();
      }
    });

    function initGoogleAuth() {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            sessionStorage.setItem('google_access_token', accessToken);
            setAuthorizedUI();
            fetchAllData();
          }
        },
      });
    }

    function handleAuthClick() {
      if (!tokenClient) initGoogleAuth();
      tokenClient.requestAccessToken({ prompt: '' });
    }

    function setAuthorizedUI() {
      const btnText = document.getElementById('auth-btn-text');
      const btn = document.getElementById('auth-btn');
      if(btnText && btn) {
        btnText.textContent = '接続済み';
        btn.classList.replace('bg-[#262626]', 'bg-emerald-950/60');
        btn.classList.replace('text-[#d4af37]', 'text-emerald-400');
        btn.classList.replace('border-[#d4af37]/30', 'border-emerald-500/35');
      }
    }

    function showLoading(text) {
      document.getElementById('loading-text').textContent = text;
      document.getElementById('loading-overlay').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loading-overlay').classList.add('hidden');
    }

    async function fetchAllData() {
      if (!accessToken) return;
      showLoading("データを同期中...");
      try {
        await Promise.all([fetchCalendarEvents(), fetchGoogleTasks(), fetchSheetExpenses()]);
        renderCalendar();
        renderTodaySummary();
        renderAnalytics();
      } catch(e) {
        console.error(e);
      } finally {
        hideLoading();
      }
    }

    async function fetchCalendarEvents() {
      const timeMin = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).toISOString();
      const timeMax = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0, 23, 59, 59).toISOString();
      try {
        const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const data = await res.json();
        eventsData = data.items || [];
      } catch (e) { console.error("Events fetch error:", e); }
    }

    async function addCalendarEvent(e) {
      e.preventDefault();
      if (!accessToken) return alert("Google連携を行ってください");
      
      showLoading("Googleカレンダーへ登録中...");
      const title = document.getElementById('event-title').value;
      const startInput = document.getElementById('event-start').value;
      const endInput = document.getElementById('event-end').value;
      const memo = document.getElementById('event-memo').value;
      const colorId = document.getElementById('event-color').value;

      try {
        const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            summary: title,
            description: memo,
            colorId: colorId,
            start: { dateTime: new Date(startInput).toISOString() },
            end: { dateTime: new Date(endInput).toISOString() }
          })
        });
        if (!res.ok) throw new Error('登録に失敗しました');

        document.getElementById('event-title').value = '';
        document.getElementById('event-start').value = '';
        document.getElementById('event-end').value = '';
        document.getElementById('event-memo').value = '';
        
        await fetchCalendarEvents();
        renderCalendar();
        renderTodaySummary();
        alert("予定の登録が完了しました！");
      } catch(err) {
        alert(err.message);
      } finally {
        hideLoading();
      }
    }

    async function fetchGoogleTasks() {
      try {
        const listRes = await fetch('https://www.googleapis.com/tasks/v1/users/@me/lists', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const listData = await listRes.json();
        if (!listData.items || listData.items.length === 0) return;
        const defaultListId = listData.items[0].id;

        const tasksRes = await fetch(`https://www.googleapis.com/tasks/v1/lists/${defaultListId}/tasks?showCompleted=true`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const tasksDataRes = await tasksRes.json();
        tasksData = (tasksDataRes.items || []).map(t => ({ ...t, listId: defaultListId }));
      } catch (e) { console.error("Tasks fetch error:", e); }
    }

    async function addTaskItem(e) {
      e.preventDefault();
      if (!accessToken) return alert("Google連携を行ってください");

      showLoading("Google Tasksへ登録中...");
      const title = document.getElementById('task-title').value;
      const dueInput = document.getElementById('task-due').value;
      const due = dueInput ? new Date(dueInput + 'T00:00:00Z').toISOString() : null;

      try {
        const listRes = await fetch('https://www.googleapis.com/tasks/v1/users/@me/lists', {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const listData = await listRes.json();
        const defaultListId = listData.items[0].id;

        const res = await fetch(`https://www.googleapis.com/tasks/v1/lists/${defaultListId}/tasks`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: title, due: due })
        });
        if (!res.ok) throw new Error('タスク登録に失敗しました');

        document.getElementById('task-title').value = '';
        document.getElementById('task-due').value = '';

        await fetchGoogleTasks();
        renderCalendar();
        renderTodaySummary();
        alert("タスクの登録が完了しました！");
      } catch(err) {
        alert(err.message);
      } finally {
        hideLoading();
      }
    }

    async function toggleTaskStatus(taskId, listId, currentStatus) {
      const newStatus = currentStatus === 'completed' ? 'needsAction' : 'completed';
      showLoading("タスクを更新中...");
      try {
        const res = await fetch(`https://www.googleapis.com/tasks/v1/lists/${listId}/tasks/${taskId}`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        if (!res.ok) throw new Error('更新失敗');
        await fetchGoogleTasks();
        renderCalendar();
        renderTodaySummary();
        closeModal();
      } catch(e) {
        alert("タスクの更新に失敗しました");
      } finally {
        hideLoading();
      }
    }

    async function deleteTaskItem(taskId, listId) {
      if(!confirm("このタスクを削除しますか？")) return;
      showLoading("タスクを削除中...");
      try {
        await fetch(`https://www.googleapis.com/tasks/v1/lists/${listId}/tasks/${taskId}`, {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        await fetchGoogleTasks();
        renderCalendar();
        renderTodaySummary();
        closeModal();
      } catch(e) {
        alert("削除に失敗しました");
      } finally {
        hideLoading();
      }
    }

    async function fetchSheetExpenses() {
      try {
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/A2:D1000`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        const data = await res.json();
        expensesData = (data.values || []).map(row => ({
          date: row[0],
          amount: parseInt(row[1]) || 0,
          category: row[2] || 'その他',
          memo: row[3] || ''
        }));
      } catch (e) { console.error("Sheets fetch error:", e); }
    }

    async function addExpenseRecord(e) {
      e.preventDefault();
      if (!accessToken) return alert("Google連携を行ってください");

      showLoading("スプレッドシートへ保存中...");
      const date = document.getElementById('expense-date').value;
      const amount = document.getElementById('expense-amount').value;
      const category = document.getElementById('expense-category').value;
      const memo = document.getElementById('expense-memo').value;

      try {
        const res = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/A1:append?valueInputOption=USER_ENTERED`, {
          method: 'POST',
          headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ values: [[date, amount, category, memo]] })
        });
        if (!res.ok) throw new Error('家計簿の保存に失敗しました');

        document.getElementById('expense-amount').value = '';
        document.getElementById('expense-memo').value = '';

        await fetchSheetExpenses();
        renderCalendar();
        renderAnalytics();
        alert("家計簿の記録が完了しました！");
      } catch(err) {
        alert(err.message);
      } finally {
        hideLoading();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(btn => {
        btn.classList.remove('bg-[#262626]', 'text-[#d4af37]', 'font-bold', 'shadow-sm');
        btn.classList.add('text-slate-400');
      });
      document.getElementById(`tab-${mode}`).classList.add('bg-[#262626]', 'text-[#d4af37]', 'font-bold', 'shadow-sm');

      document.getElementById('section-all-summary').classList.toggle('hidden', mode !== 'all');
      document.getElementById('input-section').classList.toggle('hidden', ['all', 'analytics', 'habit'].includes(mode));
      document.querySelectorAll('.input-form').forEach(f => f.classList.add('hidden'));
      if (['calendar', 'task', 'finance'].includes(mode)) {
        document.getElementById(`form-${mode}`).classList.remove('hidden');
      }

      document.getElementById('section-calendar').classList.toggle('hidden', ['analytics', 'habit'].includes(mode));
      document.getElementById('monthly-expense-summary').classList.toggle('hidden', mode !== 'finance');
      document.getElementById('section-analytics').classList.toggle('hidden', mode !== 'analytics');
      document.getElementById('section-habit').classList.toggle('hidden', mode !== 'habit');

      if (mode === 'analytics') renderAnalytics();
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById('calendar-month-year').textContent = `${year}年 ${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const container = document.getElementById('calendar-cells');
      container.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        container.innerHTML += `<div class="calendar-cell bg-[#161616]/50 border-r border-b border-slate-800"></div>`;
      }

      let monthlyExpenseTotal = 0;

      for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = new Date().toDateString() === new Date(year, month, day).toDateString();

        // 複数日にまたがる予定（旅行など）を判定して該当日にすべて反映
        const dayEvents = eventsData.filter(e => {
          const start = (e.start.dateTime || e.start.date || '').split('T')[0];
          const end = (e.end.dateTime || e.end.date || '').split('T')[0];
          return dateStr >= start && dateStr <= end;
        });

        const dayTasks = tasksData.filter(t => t.due && t.due.startsWith(dateStr));
        const dayExpenses = expensesData.filter(e => e.date === dateStr);
        const dayExpenseSum = dayExpenses.reduce((sum, e) => sum + e.amount, 0);
        monthlyExpenseTotal += dayExpenseSum;

        let itemsHtml = '';
        if (currentMode === 'all' || currentMode === 'calendar') {
          dayEvents.slice(0, 3).forEach(e => {
            const colorClass = e.colorId ? `gcal-color-${e.colorId}` : 'bg-[#262626] text-[#d4af37]';
            itemsHtml += `<div class="${colorClass} text-[10px] px-1.5 py-0.5 rounded truncate-1 mb-0.5 font-medium">${e.summary}</div>`;
          });
        }
        if (currentMode === 'all' || currentMode === 'task') {
          dayTasks.slice(0, 2).forEach(t => {
            const isDone = t.status === 'completed';
            itemsHtml += `<div class="bg-[#222825] ${isDone ? 'text-slate-500 line-through' : 'text-emerald-400'} text-[10px] px-1.5 py-0.5 rounded truncate-1 mb-0.5">✓ ${t.title}</div>`;
          });
        }
        if (dayExpenseSum > 0 && (currentMode === 'all' || currentMode === 'finance')) {
          itemsHtml += `<div class="bg-rose-950/50 text-rose-400 font-bold text-[10px] px-1.5 py-0.5 rounded truncate-1">¥${dayExpenseSum.toLocaleString()}</div>`;
        }

        container.innerHTML += `
          <div onclick="openModal('${dateStr}')" class="calendar-cell p-1 border-r border-b border-slate-800 hover:bg-[#222222] cursor-pointer transition relative ${isToday ? 'bg-[#262626]/40' : ''}">
            <div class="text-[11px] font-bold ${isToday ? 'w-5 h-5 bg-[#d4af37] text-slate-950 rounded-full flex items-center justify-center mx-auto' : 'text-slate-300'}">${day}</div>
            <div class="mt-1 space-y-0.5 overflow-hidden">${itemsHtml}</div>
          </div>
        `;
      }
      document.getElementById('monthly-total-amount').textContent = `¥${monthlyExpenseTotal.toLocaleString()}`;
    }

    function openModal(dateStr) {
      document.getElementById('modal-date-title').textContent = dateStr;
      
      const dayEvents = eventsData.filter(e => {
        const start = (e.start.dateTime || e.start.date || '').split('T')[0];
        const end = (e.end.dateTime || e.end.date || '').split('T')[0];
        return dateStr >= start && dateStr <= end;
      });
      const dayTasks = tasksData.filter(t => t.due && t.due.startsWith(dateStr));
      const dayExpenses = expensesData.filter(e => e.date === dateStr);

      // ご指定のフォーマット（予定の開始・終了時間 ＋ メモ）
      document.getElementById('modal-events-list').innerHTML = dayEvents.length ? dayEvents.map(e => {
        const startTime = e.start.dateTime ? new Date(e.start.dateTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '終日';
        const endTime = e.end.dateTime ? new Date(e.end.dateTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
        const timeStr = endTime ? `${startTime}〜${endTime}` : startTime;
        return `
          <div class="p-2.5 bg-[#222222] rounded-xl border border-slate-800 mb-2 space-y-1">
            <div class="font-semibold text-slate-100 flex justify-between items-center">
              <span>・ ${e.summary} (${timeStr})</span>
              <button onclick="openEditModal('${e.id}')" class="text-[10px] px-2 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-slate-200">編集</button>
            </div>
            ${e.description ? `<div class="text-slate-400 text-[11px] whitespace-pre-wrap pl-3 border-l-2 border-[#d4af37]/40">${e.description}</div>` : '<div class="text-slate-500 text-[11px] pl-3 italic">メモなし</div>'}
          </div>
        `;
      }).join('') : '<span class="text-slate-500">なし</span>';

      document.getElementById('modal-tasks-list').innerHTML = dayTasks.length ? dayTasks.map(t => {
        const isDone = t.status === 'completed';
        return `
          <div class="flex items-center justify-between p-2 bg-[#222222] rounded-lg border border-slate-800 mb-1">
            <span class="${isDone ? 'line-through text-slate-500' : 'text-slate-200'}">✓ ${t.title}</span>
            <div class="flex items-center space-x-2">
              <button onclick="toggleTaskStatus('${t.id}', '${t.listId}', '${t.status}')" class="px-2 py-1 bg-${isDone ? 'slate-700' : 'emerald-700'} text-white rounded text-[10px]">${isDone ? '戻す' : '完了'}</button>
              <button onclick="deleteTaskItem('${t.id}', '${t.listId}')" class="text-slate-500 hover:text-rose-400 p-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
        `;
      }).join('') : '<span class="text-slate-500">なし</span>';

      document.getElementById('modal-expenses-list').innerHTML = dayExpenses.length ? dayExpenses.map(e => `<div class="p-1.5 bg-[#222222] rounded-lg mb-1">・ ${e.category}: ¥${e.amount.toLocaleString()} (${e.memo || 'メモなし'})</div>`).join('') : '<span class="text-slate-500">なし</span>';

      document.getElementById('detail-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    // 予定の編集モーダルを開く
    function openEditModal(eventId) {
      const ev = eventsData.find(item => item.id === eventId);
      if(!ev) return;
      document.getElementById('edit-ev-id').value = ev.id;
      document.getElementById('edit-ev-title').value = ev.summary || '';
      document.getElementById('edit-ev-start').value = ev.start.dateTime ? ev.start.dateTime.slice(0, 16) : '';
      document.getElementById('edit-ev-end').value = ev.end.dateTime ? ev.end.dateTime.slice(0, 16) : '';
      document.getElementById('edit-ev-memo').value = ev.description || '';
      document.getElementById('edit-event-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-event-modal').classList.add('hidden');
    }

    async function updateCalendarEvent() {
      const eventId = document.getElementById('edit-ev-id').value;
      const title = document.getElementById('edit-ev-title').value;
      const startInput = document.getElementById('edit-ev-start').value;
      const endInput = document.getElementById('edit-ev-end').value;
      const memo = document.getElementById('edit-ev-memo').value;

      showLoading("予定を更新中...");
      try {
        const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            summary: title,
            description: memo,
            start: { dateTime: new Date(startInput).toISOString() },
            end: { dateTime: new Date(endInput).toISOString() }
          })
        });
        if(!res.ok) throw new Error('更新失敗');
        closeEditModal();
        closeModal();
        await fetchCalendarEvents();
        renderCalendar();
        renderTodaySummary();
        alert("予定を更新しました！");
      } catch(e) {
        alert("更新に失敗しました");
      } finally {
        hideLoading();
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      if (accessToken) fetchCalendarEvents().then(renderCalendar);
      else renderCalendar();
    }
    
    function goToday() {
      currentDate = new Date();
      if (accessToken) fetchCalendarEvents().then(renderCalendar);
      else renderCalendar();
    }

    function renderTodaySummary() {
      const todayStr = new Date().toISOString().split('T')[0];
      const todayEvents = eventsData.filter(e => {
        const start = (e.start.dateTime || e.start.date || '').split('T')[0];
        const end = (e.end.dateTime || e.end.date || '').split('T')[0];
        return todayStr >= start && todayStr <= end;
      });
      const todayTasks = tasksData.filter(t => t.due && t.due.startsWith(todayStr));

      document.getElementById('today-events-list').innerHTML = todayEvents.length ? todayEvents.map(e => `<div class="p-2 bg-[#222222] rounded-xl border border-slate-800">・ ${e.summary} ${e.description ? `<br><span class="text-slate-400 text-[10px]">📝 ${e.description}</span>` : ''}</div>`).join('') : '<p class="text-slate-500 italic">今日の予定はありません</p>';
      
      document.getElementById('today-tasks-list').innerHTML = todayTasks.length ? todayTasks.map(t => {
        const isDone = t.status === 'completed';
        return `
          <div class="flex items-center justify-between p-2 bg-[#222222] rounded-xl border border-slate-800">
            <span class="${isDone ? 'line-through text-slate-500' : 'text-slate-200'}">✓ ${t.title}</span>
            <button onclick="toggleTaskStatus('${t.id}', '${t.listId}', '${t.status}')" class="px-2 py-1 bg-${isDone ? 'slate-700' : 'emerald-700'} text-white rounded text-[10px]">${isDone ? '戻す' : '完了'}</button>
          </div>
        `;
      }).join('') : '<p class="text-slate-500 italic">今日のタスクはありません</p>';
    }

    function renderHabits() {
      const list = document.getElementById('habit-list');
      list.innerHTML = habitsData.length ? habitsData.map((h, i) => `
        <div class="flex items-center justify-between p-3 bg-[#222222] rounded-xl border border-slate-800 text-xs">
          <span class="font-medium text-slate-200">${h.name}</span>
          <div class="flex items-center space-x-2">
            <button onclick="updateHabitCount(${i}, -1)" class="w-6 h-6 bg-[#333333] rounded-lg text-slate-300 font-bold">-</button>
            <span class="font-bold text-[#d4af37] w-6 text-center">${h.count || 0}</span>
            <button onclick="updateHabitCount(${i}, 1)" class="w-6 h-6 bg-[#d4af37] rounded-lg text-slate-950 font-bold">+</button>
            <button onclick="deleteHabit(${i})" class="text-slate-500 hover:text-rose-400 ml-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        </div>
      `).join('') : '<p class="text-slate-500 italic text-xs">習慣が登録されていません</p>';
      lucide.createIcons();
    }

    function addHabit(e) {
      e.preventDefault();
      const input = document.getElementById('habit-name');
      habitsData.push({ name: input.value, count: 0 });
      localStorage.setItem('habits', JSON.stringify(habitsData));
      input.value = '';
      renderHabits();
    }

    function updateHabitCount(index, delta) {
      habitsData[index].count = Math.max(0, (habitsData[index].count || 0) + delta);
      localStorage.setItem('habits', JSON.stringify(habitsData));
      renderHabits();
    }

    function deleteHabit(index) {
      habitsData.splice(index, 1);
      localStorage.setItem('habits', JSON.stringify(habitsData));
      renderHabits();
    }

    let chartInstance = null;
    function renderAnalytics() {
      const ctx = document.getElementById('category-chart').getContext('2d');
      const categories = {};
      expensesData.forEach(e => {
        categories[e.category] = (categories[e.category] || 0) + e.amount;
      });

      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(categories),
          datasets: [{
            data: Object.values(categories),
            backgroundColor: ['#f43f5e', '#3b82f6', '#10b981', '#d4af37', '#8b5cf6', '#64748b']
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1' } } } }
      });
    }

    function saveBudget() {
      const val = document.getElementById('budget-input').value;
      localStorage.setItem('budget', val);
    }
  </script>
</body>
</html>
